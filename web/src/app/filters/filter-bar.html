<form class="bar" aria-label="Filters" (submit)="$event.preventDefault()">
  <fieldset class="field">
    <legend>Window</legend>
    <div class="segments" role="group" aria-label="Window">
      @for (w of windows; track w) {
        <button
          type="button"
          [attr.aria-pressed]="store.window() === w"
          (click)="store.window.set(w)"
        >
          {{ w }} days
        </button>
      }
    </div>
  </fieldset>

  <label class="field">
    <span>Category</span>
    <select #category (change)="onCategory(category.value)">
      <option value="" [selected]="store.category() === null">All categories</option>
      @for (c of categories(); track c) {
        <option [value]="c" [selected]="store.category() === c">{{ c }}</option>
      }
      @if (unknownCategory(); as c) {
        <option [value]="c" selected>{{ c }}</option>
      }
    </select>
  </label>

  <label class="field">
    <span>Council district</span>
    <select #district (change)="onDistrict(district.value)">
      <option value="" [selected]="store.district() === null">Whole city</option>
      @for (d of districts; track d) {
        <option [value]="d" [selected]="store.district() === d">District {{ d }}</option>
      }
    </select>
  </label>

  <label class="field">
    <span>Neighborhood</span>
    <select #neighborhood (change)="onNeighborhood(neighborhood.value)">
      <option value="" [selected]="store.neighborhood() === null">None selected</option>
      @for (n of neighborhoods(); track n.slug) {
        <option [value]="n.slug" [selected]="store.neighborhood() === n.slug">{{ n.name }}</option>
      }
      @if (unknownNeighborhood(); as slug) {
        <option [value]="slug" selected>{{ slug }}</option>
      }
    </select>
  </label>

  <label class="field">
    <span>Backlog chart</span>
    <select #range (change)="onRange(range.value)">
      @for (r of ranges; track r.value) {
        <option [value]="r.value" [selected]="store.range() === r.value">{{ r.label }}</option>
      }
    </select>
  </label>
</form>
